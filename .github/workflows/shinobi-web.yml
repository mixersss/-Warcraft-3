name: Publish Shinobi browser games
on:
  push:
    branches: [main]
    paths: ['shinobi-strategy/**', 'shinobi-fighter/**', '.github/workflows/shinobi-web.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: shinobi-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent RTS simulation
        run: node --test shinobi-strategy/test/engine.test.js
      - name: Verify independent fighting simulation
        run: |
          node shinobi-fighter/test/combat.test.js
          node shinobi-fighter/test/voices.test.js
      - name: Prepare both browser games
        run: |
          mkdir -p _site/fighter
          cp -R shinobi-strategy/. _site/
          cp -R shinobi-fighter/. _site/fighter/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
